# The template's manifest, read by Tools/universes.sh. Never shown in the app: the folder's `_` keeps it out of every
# build but a TEMPLATE=1 one, and so do number 999 and `template = yes`. Start a universe of your own with
#   Tools/new-universe.sh <Folder> <Prefix> <key> "<Title>" <number>
# which copies this folder and fills these lines in for you. The number and key are forever, and come from NUMBERS
# (ask the owner for a line there before you start).
number   = 999
key      = template
title    = Sample Universe
prefix   = Template
entry    = TemplateUniverse
reel     = template
cask     =
detail   = 0 characters, 0 places   # redrawn to the detail bar so far, for clawd-plans' status; bump it with each batch
template = yes
